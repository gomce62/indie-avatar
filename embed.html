<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indie Presenter Embed</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      indie-presenter {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <indie-presenter id="indie"></indie-presenter>

    <script type="module">
      import './src/indie-presenter.js';

      const presenter = document.getElementById('indie');
      const params = new URLSearchParams(window.location.search);

      const config = {};
      if (params.has('outfits')) config.outfits = params.get('outfits');
      if (params.has('outfit')) config.outfit = params.get('outfit');
      if (params.has('mode')) config.mode = params.get('mode');
      if (params.has('locationName')) config.locationName = params.get('locationName');
      if (params.has('badgeText')) config.badgeText = params.get('badgeText');
      if (params.has('tagline')) config.tagline = params.get('tagline');
      if (params.has('script')) config.script = params.get('script');
      if (params.has('lat')) config.lat = params.get('lat');
      if (params.has('lon')) config.lon = params.get('lon');
      if (params.has('rate')) config.rate = params.get('rate');
      if (params.has('pitch')) config.pitch = params.get('pitch');
      if (params.has('showCaptions')) config.showCaptions = params.get('showCaptions') !== 'false';
      if (params.has('compact')) config.compact = params.get('compact') !== 'false';

      const backgrounds = {};
      if (params.has('bgDay')) backgrounds.day = params.get('bgDay');
      if (params.has('bgRainy')) backgrounds.rainy = params.get('bgRainy');
      if (params.has('bgNightClear')) backgrounds.nightClear = params.get('bgNightClear');
      if (params.has('bgNightRainy')) backgrounds.nightRainy = params.get('bgNightRainy');
      if (Object.keys(backgrounds).length) {
        config.backgrounds = backgrounds;
      }

      presenter.setConfig(config);

      if (params.get('autoplay') === 'true') {
        setTimeout(() => presenter.play(), 250);
      }

      window.addEventListener('message', (event) => {
        const msg = event.data;
        if (!msg || typeof msg !== 'object') return;
        if (msg.type === 'indie:configure' && msg.config) {
          presenter.setConfig(msg.config);
        } else if (msg.type === 'indie:play') {
          presenter.play();
        } else if (msg.type === 'indie:stop') {
          presenter.stop();
        } else if (msg.type === 'indie:setOutfit' && msg.outfit) {
          presenter.setOutfit(msg.outfit);
        }
      });
    </script>
  </body>
</html>
