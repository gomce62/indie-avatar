<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e4d7b"/>
      <stop offset="48%" stop-color="#4e8ec2"/>
      <stop offset="82%" stop-color="#9ccbe8"/>
      <stop offset="100%" stop-color="#dceef8"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff8d6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffe7a3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffe7a3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="farMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d7ea3"/>
      <stop offset="100%" stop-color="#87a6c7"/>
    </linearGradient>
    <linearGradient id="midMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#355873"/>
      <stop offset="100%" stop-color="#4e7590"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c6c99"/>
      <stop offset="38%" stop-color="#1e5984"/>
      <stop offset="100%" stop-color="#0f3c5c"/>
    </linearGradient>
    <linearGradient id="shore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b299"/>
      <stop offset="45%" stop-color="#9e8b70"/>
      <stop offset="100%" stop-color="#6f614d"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8c6849"/>
      <stop offset="100%" stop-color="#5c422c"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1220" cy="210" r="240" fill="url(#sunGlow)"/>
  <circle cx="1220" cy="210" r="48" fill="#fff9e2" opacity="0.92"/>

  <!-- Soft clouds -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="300" cy="175" rx="160" ry="34"/>
    <ellipse cx="410" cy="165" rx="110" ry="28"/>
    <ellipse cx="830" cy="130" rx="190" ry="30"/>
    <ellipse cx="960" cy="140" rx="120" ry="24"/>
  </g>

  <!-- Distant Sierra peaks -->
  <path d="M0,470 L140,365 L280,415 L450,315 L630,410 L790,340 L970,405 L1170,320 L1350,390 L1490,345 L1600,395 L1600,520 L0,520 Z" fill="url(#farMtn)"/>
  <!-- Snow caps -->
  <path d="M450,315 L408,342 L442,337 L465,352 L495,342 Z" fill="#eef6fc" opacity="0.85"/>
  <path d="M1170,320 L1128,348 L1164,344 L1186,356 L1212,344 Z" fill="#eef6fc" opacity="0.85"/>

  <!-- Midground forested ridges -->
  <path d="M0,490 L190,425 L380,465 L580,405 L760,468 L990,420 L1210,472 L1430,422 L1600,460 L1600,545 L0,545 Z" fill="url(#midMtn)"/>

  <!-- Lake water -->
  <rect x="0" y="520" width="1600" height="240" fill="url(#lake)"/>

  <!-- Sun shimmer & water ripples -->
  <g fill="#d7f0ff" opacity="0.22">
    <rect x="1155" y="535" width="130" height="4" rx="2"/>
    <rect x="1125" y="553" width="190" height="5" rx="2"/>
    <rect x="1145" y="575" width="150" height="4" rx="2"/>
    <rect x="1100" y="602" width="235" height="6" rx="3"/>
    <rect x="1135" y="635" width="170" height="5" rx="2"/>
    <rect x="210" y="565" width="160" height="3" rx="1.5"/>
    <rect x="520" y="610" width="220" height="3" rx="1.5"/>
    <rect x="780" y="580" width="140" height="3" rx="1.5"/>
  </g>

  <!-- Shoreline -->
  <path d="M0,715 Q380,695 800,720 T1600,705 L1600,900 L0,900 Z" fill="url(#shore)"/>

  <!-- Subtle wooden pier/deck foreground -->
  <rect x="0" y="775" width="1600" height="125" fill="url(#deck)"/>
  <g stroke="#45301f" stroke-width="2" opacity="0.45">
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="0" y1="830" x2="1600" y2="830"/>
    <line x1="0" y1="862" x2="1600" y2="862"/>
  </g>

  <!-- Left & right pine silhouettes -->
  <g fill="#1d3c2b">
    <polygon points="45,760 95,470 145,760"/>
    <polygon points="115,770 160,530 205,770"/>
    <polygon points="1410,770 1465,495 1520,770"/>
    <polygon points="1490,775 1545,540 1600,775"/>
  </g>
</svg>
